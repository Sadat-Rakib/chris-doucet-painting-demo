name: Deploy client websites to Cloudflare
on:
  push:
    branches: ["codex/demo"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ github.repository }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - project: chris-doucet-painting-website
            command: pages deploy cf-dist --project-name chris-doucet-painting-website --branch codex/demo
            native: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare preserved static assets
        run: node .cloudflare/prepare.cjs ${{ matrix.project }}
      - name: Deploy to Cloudflare
        if: ${{ matrix.native != true || github.event_name == 'workflow_dispatch' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '92b5efad73f58d59af5a0c0c2a5f9373'
          wranglerVersion: '4.151.3'
          command: ${{ matrix.command }}
